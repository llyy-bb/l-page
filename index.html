<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>给你的一个小惊喜</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0010; }
  canvas { display:block; position:fixed; inset:0; }
  .text-wrap {
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; pointer-events:none;
    opacity:0; transition:opacity 1.2s ease; z-index:2;
  }
  .text-wrap.show { opacity:1; }
  .title {
    font-size:clamp(22px,6vw,34px); color:#fff; letter-spacing:4px;
    text-shadow:0 0 18px rgba(255,80,140,.9),0 0 40px rgba(255,80,140,.5);
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .sub {
    margin-top:14px; font-size:clamp(13px,3.6vw,16px); color:#ffb3cc;
    letter-spacing:2px; opacity:.85;
  }
  .heart-beat { animation:beat 1.4s ease-in-out infinite; }
  @keyframes beat {
    0%,100% { transform:scale(1); }
    50% { transform:scale(1.08); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="text-wrap" id="textWrap">
  <div class="title heart-beat">❤ 这是给你的 ❤</div>
  <div class="sub">愿每一次心动，都有回响</div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// 心形参数方程
function heartPoint(t, scale) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  return { x: x * scale, y: -y * scale };
}

// 目标心形粒子
const HEART_COUNT = 260;
const heartTargets = [];
(function buildHeart() {
  const scale = Math.min(W, H) / 42;
  for (let i = 0; i < HEART_COUNT; i++) {
    const t = (i / HEART_COUNT) * Math.PI * 2;
    const p = heartPoint(t, scale);
    heartTargets.push({
      x: W/2 + p.x + (Math.random()-0.5)*6,
      y: H/2 + p.y + (Math.random()-0.5)*6
    });
  }
})();

// 粒子类
class Particle {
  constructor(target) {
    this.tx = target.x; this.ty = target.y;
    // 从屏幕外随机位置飞入
    const angle = Math.random() * Math.PI * 2;
    const dist = Math.max(W, H) * (0.6 + Math.random()*0.4);
    this.x = W/2 + Math.cos(angle)*dist;
    this.y = H/2 + Math.sin(angle)*dist;
    this.vx = 0; this.vy = 0;
    this.size = 1.2 + Math.random()*2.2;
    this.hue = 330 + Math.random()*30; // 粉红系
    this.arrived = false;
    this.phase = Math.random()*Math.PI*2;
  }
  update() {
    if (!this.arrived) {
      const dx = this.tx - this.x, dy = this.ty - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 2) { this.arrived = true; }
      else {
        // 弹性吸引
        const force = 0.06;
        this.vx += dx * force * 0.02;
        this.vy += dy * force * 0.02;
        this.vx *= 0.92; this.vy *= 0.92;
        this.x += this.vx; this.y += this.vy;
      }
    } else {
      // 到达后轻微呼吸浮动
      this.phase += 0.03;
      this.x = this.tx + Math.sin(this.phase) * 1.5;
      this.y = this.ty + Math.cos(this.phase*1.3) * 1.5;
    }
  }
  draw() {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fillStyle = `hsla(${this.hue},100%,65%,0.9)`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = `hsla(${this.hue},100%,65%,0.8)`;
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

const particles = heartTargets.map(t => new Particle(t));

// 飘落的小爱心（背景氛围）
const floaters = [];
function spawnFloater() {
  floaters.push({
    x: Math.random()*W,
    y: H + 20,
    size: 6 + Math.random()*10,
    speed: 0.4 + Math.random()*0.9,
    drift: (Math.random()-0.5)*0.4,
    alpha: 0.15 + Math.random()*0.35,
    rot: Math.random()*Math.PI*2,
    rotSpeed: (Math.random()-0.5)*0.02
  });
}
setInterval(spawnFloater, 400);

function drawHeartShape(x, y, size, alpha, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.scale(size/20, size/20);
  ctx.beginPath();
  for (let t = 0; t <= Math.PI*2; t += 0.15) {
    const p = heartPoint(t, 1);
    if (t === 0) ctx.moveTo(p.x, p.y);
    else ctx.lineTo(p.x, p.y);
  }
  ctx.closePath();
  ctx.fillStyle = `rgba(255,105,150,${alpha})`;
  ctx.fill();
  ctx.restore();
}

let elapsed = 0;
function animate() {
  ctx.clearRect(0, 0, W, H);
  // 深色渐变背景
  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  g.addColorStop(0, 'rgba(40,0,25,0.35)');
  g.addColorStop(1, 'rgba(11,0,16,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 背景飘落爱心
  for (let i = floaters.length-1; i >= 0; i--) {
    const f = floaters[i];
    f.y -= f.speed; f.x += f.drift; f.rot += f.rotSpeed;
    if (f.y < -30) { floaters.splice(i,1); continue; }
    drawHeartShape(f.x, f.y, f.size, f.alpha, f.rot);
  }

  // 主心形粒子
  particles.forEach(p => { p.update(); p.draw(); });

  elapsed++;
  if (elapsed > 90) document.getElementById('textWrap').classList.add('show');

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
